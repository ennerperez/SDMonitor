name: Package

on:
  workflow_call:
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Install Linux packaging tools
        if: ${{ matrix.rid == 'linux-x64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dpkg fakeroot flatpak flatpak-builder rpm
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --system flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Allow publish script execution
        run: chmod +x scripts/publish-artifacts.sh scripts/package-linux.sh scripts/package-macos.sh

      - name: Publish ${{ matrix.rid }}
        run: scripts/publish-artifacts.sh ${{ matrix.rid }}

      - name: Upload ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/dist/${{ matrix.rid }}/
          if-no-files-found: error
