name: Package

on:
  workflow_call:
  workflow_dispatch:

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Allow publish script execution
        run: chmod +x scripts/install-packaging-tools.sh scripts/publish-artifacts.sh scripts/package-linux.sh scripts/package-macos.sh

      - name: Install packaging tools
        run: scripts/install-packaging-tools.sh ${{ matrix.rid }}

      - name: Publish ${{ matrix.rid }}
        run: scripts/publish-artifacts.sh ${{ matrix.rid }}

      - name: Upload ${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/dist/${{ matrix.rid }}/
          if-no-files-found: error
